[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sed-portfolio"
version = "0.1.0"
description = "Sound event detection experiments and reconstructed data pipeline from a university ML project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "torch>=2.0",
    "matplotlib>=3.7",
    "joblib>=1.3"
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
